[project]
name = "harness"
version = "0.3.0"
description = "A minimal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25.7.0",
    "openai>=1.0.0",
    "pypdf>=6.0.0",
    "pyyaml>=6.0.3",
    "websockets>=12.0",
]

[project.scripts]
harness = "harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
