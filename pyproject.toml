[project]
name = "harness"
version = "0.3.0"
description = "A minimal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25.7.0",
    "openai>=1.0.0",
    "PySide6>=6.11.2",
    "pyyaml>=6.0.3",
    "websockets>=12.0",
]

[project.scripts]
harness = "harness.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
