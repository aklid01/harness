[package]
name = "harness-desktop"
version = "0.4.0"
description = "Tauri shell for the Harness Python engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "harness_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
